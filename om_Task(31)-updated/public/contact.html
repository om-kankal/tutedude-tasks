<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Node Web Server</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="nav">
    <div class="logo">NodeSite</div>
    <nav>
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
    </nav>
  </header>

  <main class="content-page">
    <div class="badge">Contact route</div>
    <h1>Contact</h1>
    <p>
      Thanks for visiting the demo. This page confirms that the
      <code>/contact</code> route is being handled by the Node.js server.
    </p>

    <div class="contact-card">
      <div>
        <span>Email</span>
        <strong>hello@nodesite.local</strong>
      </div>
      <div>
        <span>Phone</span>
        <strong>+91 90000 00000</strong>
      </div>
      <div>
        <span>Hours</span>
        <strong>Mon - Fri, 10 AM - 6 PM</strong>
      </div>
    </div>
  </main>

  <footer>Contact page · Node.js practice project</footer>
</body>
</html>
